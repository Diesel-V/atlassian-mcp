# Deployment on the dedicated MCP VM (own VLAN). The image comes from the internal
# registry (built and scanned in CI); nothing is built or downloaded on the VM.
#
#   /etc/atlassian-mcp/.env             non-secret settings (see .env.example), 0640
#   /run/atlassian-mcp/secrets/         secrets rendered by Vault Agent, files 0400 owned by 65532
#   /run/atlassian-mcp/migrator/        schema owner DSN, only for "migrate" (optional, see README)
#   /etc/atlassian-mcp/tls/             tls.crt / tls.key for the link reverse proxy -> VM
#
# PostgreSQL is the managed cluster with its regular backups, not a container here.

x-hardening: &hardening
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  atlassian-mcp:
    <<: *hardening
    image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE}:${VERSION:?set VERSION}
    restart: unless-stopped
    env_file: /etc/atlassian-mcp/.env
    ports:
      - "8082:8080"   # TLS; firewall: reverse proxy only
      - "9090:9090"   # metrics, plain HTTP; firewall: monitoring only
    volumes:
      - /run/atlassian-mcp/secrets:/run/secrets:ro
      - /etc/atlassian-mcp/tls:/tls:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      disable: true # scratch image has no shell; health is checked from outside (/healthz, /readyz)

  # One-off schema migration as the schema owner:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    <<: *hardening
    profiles: [migrate]
    image: ${REGISTRY_IMAGE:?set REGISTRY_IMAGE}:${VERSION:?set VERSION}
    command: ["migrate"]
    env_file: /etc/atlassian-mcp/.env
    environment:
      MIGRATE_DATABASE_URL_FILE: /run/migrator/database_url
    volumes:
      - /run/atlassian-mcp/secrets:/run/secrets:ro
      - /run/atlassian-mcp/migrator:/run/migrator:ro
